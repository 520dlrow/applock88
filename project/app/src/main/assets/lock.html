<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Locked</title>
<style>
:root{
  --bg:#0e0e10;
  --surface:#17171a;
  --surface-2:#1f1f24;
  --line:rgba(245,241,232,.07);
  --text:#f5f1e8;
  --text-dim:#8a8678;
  --text-faint:#4a4842;
  --gold:#e8b923;
  --red:#d43d2e;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

.lock-mark{
  font-family:Georgia,serif;font-style:italic;
  font-size:80px;line-height:1;color:var(--gold);
  letter-spacing:-.05em;margin-bottom:8px;
  animation:fadeIn .5s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.lock-title{
  font-size:13px;color:var(--text-faint);
  letter-spacing:.15em;text-transform:uppercase;
  margin-bottom:32px;
}

.app-name{
  font-size:19px;font-weight:600;
  margin-bottom:6px;text-align:center;
  max-width:280px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.app-sub{
  font-size:12px;color:var(--text-dim);
  margin-bottom:36px;
  letter-spacing:.02em;
}

.pin-display{
  display:flex;gap:16px;margin-bottom:36px;
  height:14px;
}
.pin-dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--line);
  transition:all .18s;
}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  width:100%;max-width:300px;
}
.key{
  aspect-ratio:1;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;place-items:center;
  font-size:22px;font-weight:500;
  color:var(--text);
  cursor:pointer;
  transition:all .15s;
  user-select:none;
  font-family:monospace;
}
.key:active{transform:scale(.92);background:var(--surface-2);border-color:var(--gold)}
.key.fn{font-size:13px;color:var(--text-dim)}
.key.primary{color:var(--gold)}

.shake{animation:shake .4s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}

.hint{
  margin-top:32px;
  font-size:11.5px;
  color:var(--text-faint);
  text-align:center;
  max-width:240px;
  line-height:1.6;
  min-height:36px;
}
.hint.error{color:var(--red)}

.footer{
  position:absolute;bottom:16px;left:0;right:0;
  text-align:center;
  font-family:monospace;font-size:9px;
  color:var(--text-faint);letter-spacing:.06em;
}
</style>
</head>
<body>

<div class="lock-mark">88</div>
<div class="lock-title">App Lock</div>

<div class="app-name" id="appName">Loading...</div>
<div class="app-sub">is locked</div>

<div class="pin-display" id="pinDisplay">
  <div class="pin-dot"></div>
  <div class="pin-dot"></div>
  <div class="pin-dot"></div>
  <div class="pin-dot"></div>
</div>

<div class="keypad" id="keypad">
  <div class="key" data-n="1">1</div>
  <div class="key" data-n="2">2</div>
  <div class="key" data-n="3">3</div>
  <div class="key" data-n="4">4</div>
  <div class="key" data-n="5">5</div>
  <div class="key" data-n="6">6</div>
  <div class="key" data-n="7">7</div>
  <div class="key" data-n="8">8</div>
  <div class="key" data-n="9">9</div>
  <div class="key fn" data-act="cancel">Cancel</div>
  <div class="key" data-n="0">0</div>
  <div class="key fn primary" data-act="back">&#9003;</div>
</div>

<div class="hint" id="hint">Enter your PIN</div>

<div class="footer">App Lock 88 · MC88</div>

<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };

var BRIDGE = (typeof window.AndroidBridge !== 'undefined') ? window.AndroidBridge : null;
function bridgeCall(method){
  if(!BRIDGE) return null;
  var fn = BRIDGE[method];
  if(typeof fn !== 'function') return null;
  try {
    var args = Array.prototype.slice.call(arguments, 1);
    return fn.apply(BRIDGE, args);
  } catch(e){ return null; }
}

var pin = '';
var attempts = 0;

function renderDots(){
  var dots = $('pinDisplay').children;
  for(var i = 0; i < dots.length; i++){
    dots[i].classList.toggle('filled', i < pin.length);
  }
}

function showError(msg){
  var h = $('hint');
  h.textContent = msg;
  h.classList.add('error');
  document.body.classList.add('shake');
  setTimeout(function(){
    document.body.classList.remove('shake');
  }, 450);
  setTimeout(function(){
    h.classList.remove('error');
    h.textContent = 'Enter your PIN';
  }, 2000);
}

function tryPin(){
  var ok = bridgeCall('verifyPin', pin);
  if(ok){
    /* LockActivity calls finish() on its own */
    return;
  }
  attempts++;
  pin = '';
  renderDots();
  if(attempts >= 3){
    showError('Wrong PIN. ' + attempts + ' attempts.');
  } else {
    showError('Wrong PIN');
  }
}

function pressNumber(n){
  if(pin.length >= 8) return;
  pin += n;
  renderDots();
  if(pin.length === 4){
    /* Auto-submit at 4 digits only if user's PIN is 4 */
    /* For simplicity, wait — user taps nothing, we submit at 4 */
    setTimeout(function(){
      if(pin.length === 4) tryPin();
    }, 120);
  }
}

function pressBack(){
  if(pin.length > 0){
    pin = pin.slice(0, -1);
    renderDots();
  }
}

function cancel(){
  bridgeCall('cancel');
}

document.addEventListener('DOMContentLoaded', function(){
  var name = bridgeCall('getAppLabel') || '';
  $('appName').textContent = name || 'This app';

  Array.prototype.forEach.call(document.querySelectorAll('.key'), function(k){
    k.addEventListener('click', function(){
      var num = k.getAttribute('data-n');
      var act = k.getAttribute('data-act');
      if(num !== null){ pressNumber(num); return; }
      if(act === 'back'){ pressBack(); return; }
      if(act === 'cancel'){ cancel(); return; }
    });
  });
});

})();
</script>
</body>
</html>
